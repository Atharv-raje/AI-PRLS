name: aiprls
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - fastapi>=0.111
      - uvicorn[standard]>=0.30
      - httpx>=0.27
      - pydantic>=2.7
      - numpy>=1.26
      - sentence-transformers>=3.0
      # vLLM serves the LLM. Install on the GPU machine only; it pulls in
      # torch with CUDA. Skip it when running the app in mock mode elsewhere.
      - vllm>=0.6.0
